name: 🚀 One-Click Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Azure Primary Node Public IP'
        required: true
        default: '20.169.214.104'
      resource_group:
        description: 'Azure Resource Group'
        required: true
        default: 'rg-multinode-pos'
      vm_name:
        description: 'Azure Virtual Machine Name'
        required: true
        default: 'vm-pos-node1'
      skip_tests:
        description: 'Skip Pre-Flight Tests?'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to Azure Galera Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Pre-Flight Tests (unless skipped)
        if: ${{ !inputs.skip_tests }}
        run: |
          pip install -r backend/requirements.txt pytest httpx
          PYTHONPATH=backend pytest backend/tests/ -v --tb=short
          python3 database/07_nosql/verify_nosql.py

      - name: Check Azure Deployment Credentials
        id: check_creds
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          if [ -n "$AZURE_CREDS" ] || [ -n "$AZURE_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "✓ Deployment credentials verified."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ Notice: AZURE_CREDENTIALS / AZURE_SSH_KEY secret not found in repository."
            echo "To complete direct deployment from GitHub, add AZURE_CREDENTIALS (service principal JSON) or AZURE_SSH_KEY to Settings -> Secrets and variables -> Actions."
          fi
          if [ -n "$AZURE_CREDS" ]; then
            echo "has_azure_login=true" >> $GITHUB_OUTPUT
          else
            echo "has_azure_login=false" >> $GITHUB_OUTPUT
          fi

      - name: Azure CLI Login
        if: steps.check_creds.outputs.has_azure_login == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Frontend & Execute Push-Button Deployment
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
          TARGET_HOST: ${{ inputs.target_host }}
          ADMIN_USER: ${{ secrets.AZURE_ADMIN_USER || 'azureuser' }}
          SSH_KEY_DATA: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY_DATA" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY_DATA" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          bash infra/azure/deploy_app.sh
