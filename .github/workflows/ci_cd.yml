name: MultiNode POS - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: 'Deploy to Azure after tests pass?'
        required: true
        type: boolean
        default: true

jobs:
  # ============================================================================
  # 1. Automated Test Suite (Pytest, Frontend Build, NoSQL Verification)
  # ============================================================================
  test:
    name: Run Automated Tests & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v --tb=short

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm --prefix frontend ci || npm --prefix frontend install
          npm --prefix frontend run build

      - name: Verify NoSQL Milestone Datasets & Queries
        run: |
          python3 database/07_nosql/verify_nosql.py

  # ============================================================================
  # 2. Automated Azure Deployment
  # ============================================================================
  deploy:
    name: Deploy to Azure Galera Cluster
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_to_azure == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (for local artifact packaging)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Deployment Credentials
        id: check_creds
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          if [ -n "$AZURE_CREDS" ] || [ -n "$AZURE_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "✓ Found deployment credentials in GitHub Secrets."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ Notice: AZURE_CREDENTIALS / AZURE_SSH_KEY not yet configured in GitHub Secrets."
            echo "All automated tests have passed. Configure repository secrets to enable push-button continuous deployment."
          fi
          if [ -n "$AZURE_CREDS" ]; then
            echo "has_azure_login=true" >> $GITHUB_OUTPUT
          else
            echo "has_azure_login=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Frontend Production Bundle
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build

      - name: Azure CLI Login
        if: steps.check_creds.outputs.has_azure_login == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Execute Push-Button Deployment Script
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-multinode-pos' }}
          VM_NAME: ${{ secrets.AZURE_VM_NAME || 'vm-pos-node1' }}
          TARGET_HOST: ${{ secrets.AZURE_TARGET_HOST || '20.169.214.104' }}
          ADMIN_USER: ${{ secrets.AZURE_ADMIN_USER || 'azureuser' }}
          SSH_KEY_DATA: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          if [ -n "$SSH_KEY_DATA" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY_DATA" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          bash infra/azure/deploy_app.sh
